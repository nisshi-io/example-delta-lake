---
services:
  minio:
    # MinIO no longer publishes images. pgsty/silo is a community-maintained
    # AGPLv3 fork that still does, multi-arch, with mc at /usr/bin/mc and the
    # MinIO S3 API, including conditional writes.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    volumes:
      - minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 5s
      retries: 1
      start_period: 5s
      timeout: 5s
  nisshi:
    image: ${NISSHI_IMAGE}
    pull_policy: always
    restart: unless-stopped
    environment:
      ADVERTISED_LISTENER_URL: ${ADVERTISED_LISTENER_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DATA_LAKE: ${DATA_LAKE}
      RUST_BACKTRACE: ${RUST_BACKTRACE}
      RUST_LOG: ${RUST_LOG}
      SCHEMA_REGISTRY: ${SCHEMA_REGISTRY}
      STORAGE_ENGINE: ${STORAGE_ENGINE}
    command: ["broker", "delta"]
    volumes:
      - ./schema/:/schema/
      - ./data/:/data/
    ports:
      - 9092:9092
volumes:
  minio:
    driver: local
